name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: README quickstart is regenerable and current
        run: python scripts/gen_readme.py --check

  guards:
    name: source guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # grep exits 0 on match, 1 on no-match, 2 on error. Only 1 is "clean",
      # so `|| test $? -eq 1` — never `|| true`, which would also swallow 2.
      - name: No percent formatting outside the unit renderer
        run: |
          set -euo pipefail
          hits=$(grep -rn --include='*.py' --exclude='units.py' -E ':[-+#,._0-9]*%\}' cdfipricing || test $? -eq 1)
          if [ -n "$hits" ]; then
            echo "Percent format specifiers must live in cdfipricing/data/units.py"
            echo "so that every rendered field's unit comes from UNIT_REGISTRY:"
            echo "$hits"
            exit 1
          fi

      - name: No currency formatting outside the unit renderer
        run: |
          set -euo pipefail
          hits=$(grep -rn --include='*.py' --exclude='units.py' -F '${' cdfipricing || test $? -eq 1)
          if [ -n "$hits" ]; then
            echo "Currency formatting must live in cdfipricing/data/units.py:"
            echo "$hits"
            exit 1
          fi

      - name: No stale 0.1.0 version assignment
        run: |
          set -euo pipefail
          hits=$(grep -rnIE --exclude-dir=__pycache__ \
                   '(^|[^A-Za-z_])(__version__|version)[[:space:]]*=[[:space:]]*"0\.1\.0"' \
                   pyproject.toml setup.py cdfipricing || test $? -eq 1)
          if [ -n "$hits" ]; then
            echo "Stale 0.1.0 version assignment:"
            echo "$hits"
            exit 1
          fi

  build:
    name: build and metadata check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Wheel contains the package and nothing else top-level
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          tops = set()
          for name in zipfile.ZipFile(wheels[0]).namelist():
              tops.add(name.split("/", 1)[0])
          unexpected = {t for t in tops if not (t == "cdfipricing" or t.endswith(".dist-info"))}
          if unexpected:
              print("unexpected top-level entries in wheel:", sorted(unexpected))
              sys.exit(1)
          print("wheel top-level entries OK:", sorted(tops))
          PY
